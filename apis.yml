name: Casper
description: >-
  Casper (Casper Sleep Inc.) is a direct-to-consumer sleep and home goods brand that
  sells mattresses, bedding, pillows, and sleep accessories online at casper.com and
  through retail partners. Its casper.com storefront runs on Shopify and exposes a
  modern agentic-commerce surface: a published llms.txt/agents.md with agent
  instructions, the Universal Commerce Protocol (UCP) merchant profile, a UCP shopping
  MCP endpoint for AI agents to search, cart, and check out, and Shopify Customer
  Account API OpenID Connect authentication. Casper was added to the API Evangelist
  network as a portfolio company of IVP and Slow Ventures and enriched from its live
  public agent/commerce surface.
